<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="tgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#aaaaaa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with slightly rounded corners -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- T mark — tight, centered, weighted -->
  <g filter="url(#glow)">
    <!-- crossbar -->
    <rect x="5" y="7" width="22" height="5" rx="1.5" fill="url(#tgrad)"/>
    <!-- stem -->
    <rect x="13" y="12" width="6" height="13" rx="1.5" fill="url(#tgrad)"/>
  </g>
</svg>
